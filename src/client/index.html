<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <base target="_top">
    <title>マニフェスト登録スキャナー</title>
    <?!= include('client/styles'); ?>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header"><div><p class="eyebrow">社内実験版</p><h1>マニフェスト登録スキャナー</h1></div><span id="auth-status" class="status-chip">確認中</span></header>
      <section class="panel" aria-labelledby="operator-heading"><h2 id="operator-heading">担当者</h2><label for="operator">担当者名</label><select id="operator"><option value="">読み込み中…</option></select><p id="account" class="muted">Googleアカウントを確認中…</p></section>
      <section class="panel camera-panel" aria-labelledby="camera-heading"><div class="panel-heading"><h2 id="camera-heading">撮影</h2><span id="ocr-status" class="status-chip">準備中</span></div><div class="camera-frame"><video id="camera" autoplay playsinline muted aria-label="撮影プレビュー"></video><div class="guide" aria-hidden="true"><span>番号と票種を枠内へ</span></div></div><canvas id="capture-canvas" hidden></canvas><div class="button-row"><button id="start-camera" class="secondary">カメラを起動</button><button id="capture" class="primary" disabled>撮影して読み取る</button></div><p class="muted">画像はこの端末内だけで処理し、サーバーへ送信しません。</p></section>
      <section id="result-panel" class="panel" aria-labelledby="result-heading" hidden><div class="panel-heading"><h2 id="result-heading">読み取り結果</h2><span id="confidence" class="status-chip"></span></div><div class="result-grid"><label>マニフェスト番号<input id="manifest-number" inputmode="numeric" maxlength="11"></label><label>票種<select id="ticket-type"></select></label></div><p id="result-message" class="muted"></p><div class="button-row"><button id="register" class="primary">登録</button><button id="retry" class="secondary">撮り直す</button></div></section>
      <section id="manual-panel" class="panel" aria-labelledby="manual-heading"><h2 id="manual-heading">読み取れない場合</h2><p class="muted">番号と票種を入力して登録できます。</p><div class="result-grid"><label>番号<input id="manual-number" inputmode="numeric" maxlength="11"></label><label>票種<select id="manual-ticket-type"></select></label></div><button id="manual-register" class="secondary">手入力で登録</button></section>
      <div id="message" class="message" role="status" aria-live="polite"></div><details class="diagnostics"><summary>検証情報</summary><pre id="diagnostics-output">読み込み中…</pre></details>
    </main>
    <?!= include('client/ocr-utils'); ?>
    <?!= include('client/app'); ?>
  </body>
</html>
